[project]
name = "secure-conversational-platform"
version = "1.0.0"
description = "Course project for Application and System Security: secure multi-user AI chat platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "argon2-cffi>=25.1.0",
    # 50.0.0 là bản vá PYSEC-2026-3552; giữ sàn ở đây để pip-audit trong CI không đỏ lại.
    "cryptography>=50.0.0",
    "fastapi>=0.140.0",
    "google-genai>=1.75.0,<3.0.0",
    "gradio>=6.20.0,<7.0.0",
    "pydantic>=2.11.7",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.2.9",
    "PyJWT>=2.10.1",
    "python-dotenv>=1.1.1",
    "qrcode[pil]>=7.4.2",
    "redis>=5.0.0,<7.0.0",
    "sqlalchemy>=2.0.40",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "bandit>=1.8.6",
    "httpx>=0.28.1",
    "httpx2>=2.0.0",
    "pip-audit>=2.9.0",
    "pytest>=8.4.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
