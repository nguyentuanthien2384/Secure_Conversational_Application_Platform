services:
  db:
    image: postgres:17-alpine
    # Hardening ngang bằng các service khác (trước đây container này không có
    # cap_drop / no-new-privileges — điểm yếu nhất trong chuỗi hạ tầng).
    environment:
      POSTGRES_DB: secure_chat
      POSTGRES_USER: secure_chat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      AUDITOR_DB_PASSWORD: ${AUDITOR_DB_PASSWORD:?set AUDITOR_DB_PASSWORD in .env}
      # scram-sha-256 thay cho md5: md5 đã bị coi là yếu cho xác thực Postgres.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    command:
      - postgres
      # Ghi log kết nối/ngắt kết nối và mọi lệnh DDL để đẩy sang SIEM (Bài 4 §audit).
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"
      - "-c"
      - "log_statement=ddl"
      - "-c"
      - "log_min_duration_statement=1000"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db_roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
      - ./scripts/db_least_privilege.sql:/opt/scap/db_least_privilege.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secure_chat -d secure_chat"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Postgres cần đổi UID sau khi initdb chạy dưới root trong entrypoint.
      - CHOWN
      - SETUID
      - SETGID
      - DAC_READ_SEARCH
    # Chỉ nằm trong mạng nội bộ: không service nào ngoài app chạm tới được.
    networks: [backend]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    read_only: true
    tmpfs:
      - /data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://secure_chat:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/secure_chat
    command: ["/app/.venv/bin/python", "scripts/migrate_database.py"]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks: [backend]

  app:
    build: .
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://scap_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/secure_chat
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: https://${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN in .env}
      ALLOWED_HOSTS: ${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN in .env}
      DOCS_ENABLED: "false"
      PASSWORD_BREACH_CHECK: "true"
      SEED_DEMO_DATA: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Chống DoS làm cạn tài nguyên host (Bài 1 §Availability): một tiến trình
    # bị khai thác cũng không kéo sập cả máy chủ.
    pids_limit: 512
    mem_limit: 1g
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    networks: [backend, edge]
    expose:
      - "8000"

  caddy:
    image: caddy:2.10-alpine
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN in .env}
      CADDY_EMAIL: ${CADDY_EMAIL:?set CADDY_EMAIL in .env}
      SECURITY_TXT_EXPIRES: ${SECURITY_TXT_EXPIRES:?set SECURITY_TXT_EXPIRES in .env}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      # Chỉ để bind cổng 80/443 (<1024), không cần quyền root đầy đủ.
      - NET_BIND_SERVICE
    pids_limit: 256
    mem_limit: 512m
    # Caddy chỉ ở mạng "edge"; nó không nhìn thấy Postgres hay Redis.
    networks: [edge]

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  # Phân đoạn mạng (Bài 7 §7.4): DB/Redis nằm trong mạng nội bộ không ra Internet,
  # chỉ Caddy được phơi ra ngoài. Đây là mô hình DMZ thu nhỏ.
  backend:
    driver: bridge
    internal: true
  edge:
    driver: bridge
