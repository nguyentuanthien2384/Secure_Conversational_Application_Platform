[package]
name = "scap-mls-native"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.91"

[dependencies]
openmls = "=0.9.1"
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
openmls_traits = "=0.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# HPKE 0.7 pins an optional vulnerable KEM provider. Preserve its public API
# while resolving the fixed KEM; see vendor/hpke-rs-libcrux/BACKPORT.md.
[patch.crates-io]
hpke-rs-libcrux = { path = "vendor/hpke-rs-libcrux" }

[profile.release]
strip = true
panic = "abort"

