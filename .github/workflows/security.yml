name: test-and-security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job is read-only by default. The attestation job receives its narrowly
# scoped write permissions below and only runs for the protected main ref.
permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # 0.10.0 is affected by GHSA-pjjw-68hj-v9mw and
          # GHSA-4gg8-gxpx-9rph; keep the runner tool on the fixed release.
          version: "0.11.15"
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: uv lock --check
      - run: uv sync --frozen --group dev
      - run: uv run python -m pytest --cov=src.app --cov-report=xml
      - run: uv run ruff check src tests scripts
      - run: uv run bandit -r src/app -ll -ii -f json -o reports-bandit.json
      - run: uv export --frozen --no-dev --no-emit-project --output-file requirements-audit.txt
      - run: uv run pip-audit -r requirements-audit.txt -f json -o reports-pip-audit.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: security-test-reports
          retention-days: 14
          if-no-files-found: ignore
          path: |
            coverage.xml
            reports-bandit.json
            reports-pip-audit.json

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # v3 uses the supported Node 24 runtime; v2 stops working on hosted
      # runners when GitHub removes Node 20 in September 2026.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.15"
          enable-cache: true
      # The former semgrep-action is archived. Run the official Semgrep CLI at
      # an explicit release instead of executing the deprecated wrapper action.
      - name: Run Semgrep SAST
        run: uvx --from "semgrep==1.172.0" semgrep scan --config auto --error --metrics=off .

  filesystem-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Generate CycloneDX SBOM from source tree
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom-source.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sbom-source
          retention-days: 14
          if-no-files-found: ignore
          path: sbom-source.cdx.json

  image-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require an immutable production base image
        env:
          BASE_IMAGE: ${{ vars.PYTHON_BASE_IMAGE }}
        shell: bash
        run: |
          if [[ ! "$BASE_IMAGE" =~ ^[^[:space:]@]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Set repository variable PYTHON_BASE_IMAGE to a verified digest-pinned reference (for example python:3.12-slim@sha256:<64 lowercase hex chars>)."
            exit 1
          fi
          echo "BASE_IMAGE=$BASE_IMAGE" >> "$GITHUB_ENV"
      - name: Build container image
        run: >-
          docker build
          --build-arg BASE_IMAGE="$BASE_IMAGE"
          --build-arg REQUIRE_BASE_IMAGE_DIGEST=true
          --label org.opencontainers.image.revision="${GITHUB_SHA}"
          --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          -t secure-chat:ci .
      - name: Scan built image (not just the source tree)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: secure-chat:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Generate CycloneDX SBOM from built image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: secure-chat:ci
          format: cyclonedx
          output: sbom-image.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sbom-image
          retention-days: 14
          if-no-files-found: ignore
          path: sbom-image.cdx.json
      - name: Export the exact scanned image for attestation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker save --output secure-chat-image.tar secure-chat:ci
          sha256sum secure-chat-image.tar sbom-image.cdx.json > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: secure-chat-supply-chain
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: |
            secure-chat-image.tar
            sbom-image.cdx.json
            SHA256SUMS

  attest-image:
    # Public repositories support attestations on all current plans. Private or
    # internal repositories require Enterprise Cloud and explicit opt-in here.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (github.event.repository.visibility == 'public' || vars.ENABLE_PRIVATE_ATTESTATIONS == 'true')
    needs: [test, secret-scan, sast, filesystem-scan, image-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: secure-chat-supply-chain
          path: supply-chain
      - name: Attest build provenance for the scanned image archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: supply-chain/secure-chat-image.tar
      - name: Attest the image CycloneDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: supply-chain/secure-chat-image.tar
          sbom-path: supply-chain/sbom-image.cdx.json
